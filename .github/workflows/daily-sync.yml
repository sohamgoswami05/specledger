name: Flipkart Daily Price & Restock Sync

on:
  schedule:
    # Runs at 03:00 UTC every day (08:30 AM IST - India Standard Time)
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      pincode:
        description: 'Target delivery pincode to test (default: 700034)'
        required: false
        default: '700034'
      debug:
        description: 'Enable --debug mode (logs HTTP/title and captures artifacts on failure)'
        required: false
        type: boolean
        default: false

concurrency:
  group: flipkart-daily-sync
  cancel-in-progress: false

jobs:
  scrape-and-sync:
    name: Scrape Flipkart & Sync Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements.txt'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Install Playwright Chromium
        run: |
          playwright install --with-deps chromium

      - name: Run Flipkart Sync Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TARGET_PINCODE: ${{ github.event.inputs.pincode || vars.TARGET_PINCODE || '700034' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ inputs.debug }}" = "true" ]; then
            python scripts/flipkart_daily_sync.py --debug
          else
            python scripts/flipkart_daily_sync.py
          fi

      - name: Upload Debug Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flipkart-sync-debug-${{ github.run_id }}
          path: |
            scripts/debug_page.png
            scripts/debug_page.html
          if-no-files-found: ignore
          retention-days: 7
